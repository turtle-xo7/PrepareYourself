<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="theme.css"><script src="engine.js"></script></head>
<body>
<div id="frame" style="width:1560px;height:960px">
  <div class="head">
    <div class="kicker">Prepare Yourself · Design Documentation</div>
    <div class="title">Sequence 4 — Contest Participation &amp; Leaderboard</div>
    <div class="subtitle">Registration, timed submission, auto-scoring, and live standings</div>
  </div>

  <div class="seq" id="seq"></div>

  <div class="foot">
    <div class="legend">
      <span class="leg"><span class="sw" style="background:#16324f;border-color:#16324f"></span>Actor</span>
      <span class="leg"><span class="sw" style="background:#fff;border-top:4px solid #0d9488"></span>View</span>
      <span class="leg"><span class="sw" style="background:#f0fdfa;border-color:#99f6e4"></span>Model</span>
      <span class="leg"><span class="sw" style="background:#fffdf7;border-color:#fde68a"></span>Leaderboard query</span>
    </div>
    <div class="credit">Prepare Yourself · SEQ 4 · 2026</div>
  </div>
</div>

<script>
window.draw = () => sequence(document.getElementById('seq'), {
  actors: [
    { id: 'st', label: 'Student',         sub: 'browser', tone: 'actor' },
    { id: 'cv', label: 'contest views',   sub: 'views/contests.py', tone: 'view' },
    { id: 'cm', label: 'Contest',         sub: 'model', tone: 'model' },
    { id: 'cs', label: 'ContestSubmission', sub: 'model', tone: 'model' },
    { id: 'lb', label: 'Leaderboard',     sub: 'cached query', tone: 'store' },
  ],
  rowH: 56,
  phases: [
    { label: 'Register & enter', fromRow: 0, toRow: 4 },
    { label: 'Submit & rank', fromRow: 5.6, toRow: 10.6 },
  ],
  activations: [
    { actor: 'cv', fromRow: 0, toRow: 4 },
    { actor: 'cv', fromRow: 5.6, toRow: 10.6 },
  ],
  steps: [
    { from: 'st', to: 'cv', label: 'GET /contests/{pk}/', code: true },
    { from: 'cv', to: 'cm', label: 'get_object_or_404(Contest, pk)', code: true },
    { from: 'cm', to: 'cv', label: '{title, window, is_live, rules}', ret: true, code: true },
    { from: 'st', to: 'cv', label: 'POST register — rated / unrated', code: true },
    { from: 'cv', to: 'st', label: 'render exam with countdown timer', ret: true, gap: .6 },
    { from: 'st', to: 'cv', label: 'POST answers (or timer auto-submit)', code: true },
    { from: 'cv', to: 'cs', label: 'create(submission) · auto-mark MCQ', code: true },
    { from: 'cs', to: 'cv', label: 'total_marks · duration', ret: true, code: true },
    { from: 'cv', to: 'lb', label: 'order_by(-score, duration)', code: true },
    { from: 'lb', to: 'cv', label: 'standings + percentile', ret: true },
    { from: 'cv', to: 'st', label: 'result — rank · score · rating Δ · coins', ret: true },
  ],
});
</script>
</body></html>
