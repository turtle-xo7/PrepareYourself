<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="theme.css"><script src="engine.js"></script>
<style>
  .gantt { flex: 1; margin: 14px 84px 6px 44px; position: relative; display: grid;
           grid-template-columns: 330px 1fr; row-gap: 26px; align-content: start; padding-top: 44px; }
  .glabel { padding-right: 22px; }
  .glabel b { display: block; font-size: 14px; font-weight: 800; letter-spacing: -.01em; }
  .glabel span { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); margin-top: 3px; }
  .gtrack { position: relative; height: 46px; }
  .gbar {
    position: absolute; top: 0; height: 46px; border-radius: 12px;
    box-shadow: 0 10px 24px rgba(15,23,42,.16), inset 0 1px 0 rgba(255,255,255,.25);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; font-weight: 800; letter-spacing: .02em; white-space: nowrap;
  }
  .axis { position: absolute; inset: 0; pointer-events: none; }
  .month { position: absolute; top: -6px; bottom: 6px; border-left: 1.5px dashed #e2e8f0; }
  .month b { position: absolute; top: -22px; left: 6px; font-size: 11px; font-weight: 700; color: var(--faint); }
  .gcap { position: absolute; top: 0; height: 46px; display: flex; align-items: center;
          font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; padding-left: 12px; }
  .snap { position: absolute; top: -6px; bottom: -10px; border-left: 2.5px dashed #dc2626; }
  .snap b {
    position: absolute; top: -26px; left: 50%; transform: translateX(-50%);
    background: #fef2f2; border: 1.5px solid #fecaca; color: #dc2626;
    border-radius: 999px; padding: 4px 13px; font-size: 11px; font-weight: 800; white-space: nowrap;
  }
</style></head>
<body>
<div id="frame" style="width:1640px;height:840px">
  <div class="head">
    <div class="kicker">Prepare Yourself · Project Management</div>
    <div class="title">Project Timeline — Sprint Gantt, Feb – Dec 2026</div>
    <div class="subtitle">Five Scrum sprints from foundation to final delivery · snapshot taken 14 May 2026</div>
  </div>

  <div class="gantt" id="gantt"></div>

  <div class="foot">
    <div class="legend"><span class="leg">Bars span sprint start → end · dashed red line marks the report snapshot</span></div>
    <div class="credit">Prepare Yourself · Gantt · 2026</div>
  </div>
</div>

<script>
window.draw = () => {
  const sprints = [
    { name: 'Sprint 1 — Foundation',        sub: 'Auth · profile · subscription view',            s: '2026-02-01', e: '2026-03-06', c: ['#16324f', '#1d4d74'] },
    { name: 'Sprint 2 — Payments',          sub: 'Payment flow + mock test system',               s: '2026-03-07', e: '2026-03-21', c: ['#0369a1', '#0284c7'] },
    { name: 'Sprint 3 — Learning Content',  sub: 'Question bank · notes · test enhancements',     s: '2026-04-04', e: '2026-07-15', c: ['#047857', '#0d9488'] },
    { name: 'Sprint 4 — Analytics & Admin', sub: 'Dashboards · admin panels · advanced features', s: '2026-07-16', e: '2026-09-30', c: ['#b45309', '#d97706'] },
    { name: 'Sprint 5 — Delivery',          sub: 'Results · admin dashboard · test suite',        s: '2026-10-01', e: '2026-12-15', c: ['#6d28d9', '#7c3aed'] },
  ];
  const t0 = new Date('2026-02-01').getTime();
  const t1 = new Date('2026-12-31').getTime();
  const pct = d => ((new Date(d).getTime() - t0) / (t1 - t0)) * 100;

  const g = document.getElementById('gantt');

  /* month grid + snapshot line live in an axis layer over the bar column */
  const axisHost = document.createElement('div');
  axisHost.style.cssText = 'grid-column:2;grid-row:1/span ' + sprints.length + ';position:relative;';

  let rowsHtml = '';
  sprints.forEach(sp => {
    const left = pct(sp.s), width = pct(sp.e) - left;
    const days = Math.round((new Date(sp.e) - new Date(sp.s)) / 864e5);
    const caption = `${new Date(sp.s).toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ` +
      `${new Date(sp.e).toLocaleDateString('en-GB',{day:'numeric',month:'short'})} · ${days}d`;
    /* short sprints can't fit their caption inside the bar — put it beside instead */
    const inside = width >= 14;
    rowsHtml += `<div class="glabel"><b>${sp.name}</b><span>${sp.sub}</span></div>` +
      `<div class="gtrack"><div class="gbar" style="left:${left}%;width:${width}%;` +
      `background:linear-gradient(135deg,${sp.c[0]},${sp.c[1]})">${inside ? caption : ''}</div>` +
      (inside ? '' : `<div class="gcap" style="left:${left + width}%">${caption}</div>`) +
      `</div>`;
  });
  g.innerHTML = rowsHtml;

  const axis = document.createElement('div');
  axis.className = 'axis';
  let months = '';
  for (let m = 1; m <= 10; m++) {
    const d = new Date(2026, 1 + m, 1);
    months += `<div class="month" style="left:${pct(d)}%"><b>${d.toLocaleDateString('en-GB',{month:'short'})}</b></div>`;
  }
  months += `<div class="month" style="left:0%"><b>Feb</b></div>`;
  months += `<div class="snap" style="left:${pct('2026-05-14')}%"><b>Snapshot · 14 May 2026</b></div>`;
  axis.innerHTML = months;

  /* place the axis behind the tracks, spanning all rows of column 2 */
  axis.style.cssText = 'position:absolute;top:0;bottom:0;left:330px;right:0;';
  g.appendChild(axis);
};
</script>
</body></html>
