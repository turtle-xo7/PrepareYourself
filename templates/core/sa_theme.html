{% comment %}Shared design system for the superadmin section (dashboard / users / revenue).{% endcomment %}
<style>
  .sa-page { background:#f0f2f5; }
  .sa-card { background:#fff; border-radius:18px; border:1px solid #e8edf2; box-shadow:0 1px 2px rgba(0,0,0,0.04),0 4px 16px rgba(0,0,0,0.04); }
  .sa-label { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#94a3b8; }
  .sa-num { font-size:2.25rem; font-weight:900; line-height:1; }
  .sa-row { border-bottom:1px solid #f1f5f9; }
  .sa-row:last-child { border-bottom:none; }
  .op-btn { display:flex; align-items:center; gap:10px; padding:9px 14px; border-radius:12px; transition:background .15s; }
  .op-btn:hover { background:#f8fafc; }
  .op-icon { width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .op-label { font-size:13px; font-weight:600; color:#374151; }
  .op-btn:hover .op-label { color:#1e293b; }
  .sa-badge { display:inline-flex; align-items:center; padding:3px 9px; border-radius:7px; font-size:11px; font-weight:700; }
  tr.sa-tr { transition:background .12s; }
  tr.sa-tr:hover { background:#f9fafb; }
  .sa-strip { border-bottom:1px solid #e8edf2; }
  .sa-strip-slate  { background:linear-gradient(to right,#f8fafc,#fff); }
  .sa-filterbar { border-bottom:1px solid #e8edf2; background:#fcfcfd; }
  .sa-thead { background:#f8fafc; border-bottom:1px solid #e8edf2; }
  .sa-foot { border-top:1px solid #e8edf2; }
  .sa-tile { border-radius:1rem; border:1px solid; }
  .sa-tile-slate  { background:#f8fafc; border-color:#e2e8f0; }
  .sa-tile-blue   { background:#eff6ff; border-color:#bfdbfe; }
  .sa-tile-purple { background:#faf5ff; border-color:#e9d5ff; }
  .sa-tile-green  { background:#f0fdf4; border-color:#bbf7d0; }

  /* Section tabs */
  .sa-tabs { display:flex; align-items:center; gap:5px; background:#fff; border:1px solid #e8edf2; border-radius:14px; padding:5px; width:max-content; max-width:100%; overflow-x:auto; box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04); }
  .sa-tab { display:flex; align-items:center; gap:7px; padding:8px 16px; border-radius:10px; font-size:13px; font-weight:700; color:#64748b; white-space:nowrap; transition:background .15s,color .15s; }
  .sa-tab:hover { background:#f1f5f9; color:#1e293b; }
  .sa-tab.is-active { background:linear-gradient(135deg,#2d1b69,#3b0f8c); color:#fff; box-shadow:0 6px 16px rgba(45,27,105,.3); }
  .sa-tab .tab-count { background:#f59e0b; color:#fff; font-size:10px; font-weight:800; border-radius:999px; padding:1px 7px; }
  .sa-tab.is-active .tab-count { background:rgba(255,255,255,.22); }

  /* KPI deltas + attention list */
  .sa-delta { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800; border-radius:999px; padding:2px 9px; }
  .sa-delta-up   { background:#dcfce7; color:#15803d; }
  .sa-delta-flat { background:#f1f5f9; color:#64748b; }
  .sa-attn { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:13px; border:1.5px solid; transition:transform .15s, box-shadow .15s; }
  .sa-attn:hover { transform:translateX(3px); }
  .sa-attn-amber { background:#fffbeb; border-color:#fde68a; }
  .sa-attn-red   { background:#fef2f2; border-color:#fecaca; }
  .sa-attn-sky   { background:#f0f9ff; border-color:#bae6fd; }
  .sa-attn-count { margin-left:auto; font-size:20px; font-weight:900; }
  .sa-minirow { display:flex; align-items:center; gap:10px; padding:9px 0; }
  .sa-minirow + .sa-minirow { border-top:1px solid #f1f5f9; }
  .sa-avatar { width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;flex-shrink:0;background:linear-gradient(135deg,#059669,#0d9488); }
  .sa-segbar { height:10px; border-radius:999px; overflow:hidden; display:flex; gap:2px; background:#f1f5f9; }

  /* ── Dark mode ── */
  html.dark .sa-page { background:#0f172a; }
  html.dark .sa-card { background:#1e293b; border-color:#334155; box-shadow:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.3); }
  html.dark .sa-label { color:#64748b; }
  html.dark .sa-row { border-bottom-color:#283548; }
  html.dark .op-btn:hover { background:#243044; }
  html.dark .op-label { color:#cbd5e1; }
  html.dark .op-btn:hover .op-label { color:#f1f5f9; }
  html.dark tr.sa-tr:hover { background:#243044; }
  html.dark .sa-strip { border-bottom-color:#334155; }
  html.dark .sa-strip-slate { background:linear-gradient(to right,rgba(148,163,184,.06),transparent); }
  html.dark .sa-filterbar { border-bottom-color:#334155; background:#16202f; }
  html.dark .sa-thead { background:#16202f; border-bottom-color:#334155; }
  html.dark .sa-foot { border-top-color:#334155; }
  html.dark .sa-tile-slate  { background:rgba(148,163,184,.08); border-color:#334155; }
  html.dark .sa-tile-blue   { background:rgba(59,130,246,.10);  border-color:rgba(59,130,246,.3); }
  html.dark .sa-tile-purple { background:rgba(139,92,246,.10);  border-color:rgba(139,92,246,.3); }
  html.dark .sa-tile-green  { background:rgba(34,197,94,.10);   border-color:rgba(34,197,94,.3); }
  html.dark .sa-tabs { background:#1e293b; border-color:#334155; }
  html.dark .sa-tab { color:#94a3b8; }
  html.dark .sa-tab:hover { background:#243044; color:#e2e8f0; }
  html.dark .sa-delta-up   { background:rgba(34,197,94,.16); color:#86efac; }
  html.dark .sa-delta-flat { background:rgba(148,163,184,.12); color:#94a3b8; }
  html.dark .sa-attn-amber { background:rgba(245,158,11,.10); border-color:rgba(245,158,11,.3); }
  html.dark .sa-attn-red   { background:rgba(239,68,68,.10);  border-color:rgba(239,68,68,.3); }
  html.dark .sa-attn-sky   { background:rgba(14,165,233,.10); border-color:rgba(14,165,233,.3); }
  html.dark .sa-minirow + .sa-minirow { border-top-color:#283548; }
  html.dark .sa-segbar { background:#283548; }
</style>
