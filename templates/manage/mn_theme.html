{% comment %}Shared design system for the manage section (panel / questions / grade queue / note requests / boards / subjects / classes).{% endcomment %}
<style>
  .mp-page { background:#f0f2f5; }
  .mp-card { background:#fff; border-radius:18px; border:1px solid #e8edf2; box-shadow:0 1px 2px rgba(0,0,0,0.04),0 4px 16px rgba(0,0,0,0.04); }
  .mp-label { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#94a3b8; }
  .mp-section-head { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
  .mp-row { border-bottom:1px solid #f1f5f9; }
  .mp-row:last-child { border-bottom:none; }
  .mp-badge { display:inline-flex; align-items:center; padding:3px 9px; border-radius:7px; font-size:11px; font-weight:700; }
  .mp-action { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:12px; transition:background .15s; }
  .mp-action:hover { background:#f8fafc; }
  .mp-action-icon { width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .mp-action-label { font-size:13px; font-weight:600; color:#374151; }
  .mp-action:hover .mp-action-label { color:#1e293b; }
  .mp-strip { border-bottom:1px solid #e8edf2; }
  .mp-strip-blue   { background:linear-gradient(to right,#eff6ff,#fff); }
  .mp-strip-violet { background:linear-gradient(to right,#f5f3ff,#fff); }
  .mp-strip-green  { background:linear-gradient(to right,#f0fdf4,#fff); }
  .mp-strip-slate  { background:linear-gradient(to right,#f8fafc,#fff); }
  .mp-strip-amber  { background:linear-gradient(to right,#fffbeb,#fff); }
  .mn-thead { background:#f8fafc; border-bottom:1px solid #e8edf2; }
  .mn-filterbar { border-bottom:1px solid #e8edf2; background:#fcfcfd; }
  .mn-foot { border-top:1px solid #e8edf2; background:#f8fafc; }
  .mn-input { border:1px solid #e2e8f0; background:#fff; color:#0f172a; outline:none; }
  tr.mn-tr { transition:background .12s; }
  tr.mn-tr:hover { background:#f9fafb; }

  /* Section tabs */
  .mn-tabs { display:flex; align-items:center; gap:5px; background:#fff; border:1px solid #e8edf2; border-radius:14px; padding:5px; width:max-content; max-width:100%; overflow-x:auto; box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04); }
  .mn-tab { display:flex; align-items:center; gap:7px; padding:8px 16px; border-radius:10px; font-size:13px; font-weight:700; color:#64748b; white-space:nowrap; transition:background .15s,color .15s; }
  .mn-tab:hover { background:#f1f5f9; color:#1e293b; }
  .mn-tab.is-active { background:linear-gradient(135deg,#0f766e,#0d9488); color:#fff; box-shadow:0 6px 16px rgba(13,148,136,.3); }
  .mn-tab .tab-count { background:#ef4444; color:#fff; font-size:10px; font-weight:800; border-radius:999px; padding:1px 7px; }
  .mn-tab .tab-count-amber { background:#f59e0b; color:#1c1917; font-size:10px; font-weight:800; border-radius:999px; padding:1px 7px; }
  .mn-tab.is-active .tab-count, .mn-tab.is-active .tab-count-amber { background:rgba(255,255,255,.22); color:#fff; }

  /* ── Dark mode ─────────────────────────────── */
  html.dark .mp-page { background:#0f172a; }
  html.dark .mp-card { background:#1e293b; border-color:#334155; box-shadow:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.3); }
  html.dark .mp-label { color:#64748b; }
  html.dark .mp-row { border-bottom-color:#283548; }
  html.dark .mp-action:hover { background:#243044; }
  html.dark .mp-action-label { color:#cbd5e1; }
  html.dark .mp-action:hover .mp-action-label { color:#f1f5f9; }
  html.dark .mp-strip { border-bottom-color:#334155; }
  html.dark .mp-strip-blue   { background:linear-gradient(to right,rgba(59,130,246,.07),transparent); }
  html.dark .mp-strip-violet { background:linear-gradient(to right,rgba(139,92,246,.07),transparent); }
  html.dark .mp-strip-green  { background:linear-gradient(to right,rgba(34,197,94,.07),transparent); }
  html.dark .mp-strip-slate  { background:linear-gradient(to right,rgba(148,163,184,.06),transparent); }
  html.dark .mp-strip-amber  { background:linear-gradient(to right,rgba(245,158,11,.07),transparent); }
  html.dark .mn-thead { background:#16202f; border-bottom-color:#334155; }
  html.dark .mn-filterbar { background:#16202f; border-bottom-color:#334155; }
  html.dark .mn-foot { border-top-color:#334155; background:#16202f; }
  html.dark .mn-input { background:#0f172a; border-color:#334155; color:#e2e8f0; }
  html.dark .mn-input::placeholder { color:#64748b; }
  html.dark tr.mn-tr:hover { background:#243044; }
  html.dark .mn-tabs { background:#1e293b; border-color:#334155; }
  html.dark .mn-tab { color:#94a3b8; }
  html.dark .mn-tab:hover { background:#243044; color:#e2e8f0; }
  html.dark .hover\:bg-slate-50\/60:hover { background:#243044 !important; }
  html.dark .hover\:bg-amber-50\/40:hover { background:rgba(245,158,11,.08) !important; }

  /* Utility-class recolors scoped to this section */
  html.dark .mp-page .bg-white { background:#1e293b; }
  html.dark .mp-page .border-gray-200, html.dark .mp-page .border-gray-100 { border-color:#334155; }
  html.dark .mp-page .border-amber-200 { border-color:rgba(245,158,11,.35); }
  html.dark .mp-page .border-green-200 { border-color:rgba(34,197,94,.35); }
  html.dark .mp-page .divide-gray-100 > :not([hidden]) ~ :not([hidden]) { border-color:#283548; }
  html.dark .mp-page .text-gray-900,
  html.dark .mp-page .text-gray-800,
  html.dark .mp-page .text-gray-700 { color:#e2e8f0; }
  html.dark .mp-page .text-gray-600 { color:#94a3b8; }
  html.dark .mp-page .text-gray-500,
  html.dark .mp-page .text-gray-400 { color:#7c8ba1; }
  html.dark .mp-page .text-gray-300 { color:#475569; }
  html.dark .mp-page .bg-gray-50  { background:#16202f; }
  html.dark .mp-page .bg-gray-100 { background:#283548; }
  html.dark .mp-page .bg-gray-200 { background:#334155; }
  html.dark .mp-page .bg-slate-100   { background:rgba(148,163,184,.12); }
  html.dark .mp-page .bg-blue-50, html.dark .mp-page .bg-blue-100 { background:rgba(59,130,246,.14); }
  html.dark .mp-page .bg-cyan-100   { background:rgba(6,182,212,.14); }
  html.dark .mp-page .bg-indigo-50, html.dark .mp-page .bg-indigo-100 { background:rgba(99,102,241,.14); }
  html.dark .mp-page .bg-violet-100 { background:rgba(139,92,246,.14); }
  html.dark .mp-page .bg-purple-50, html.dark .mp-page .bg-purple-100 { background:rgba(139,92,246,.14); }
  html.dark .mp-page .bg-red-50  { background:rgba(239,68,68,.08); }
  html.dark .mp-page .bg-red-100 { background:rgba(239,68,68,.14); }
  html.dark .mp-page .bg-amber-50  { background:rgba(245,158,11,.08); }
  html.dark .mp-page .bg-amber-100 { background:rgba(245,158,11,.14); }
  html.dark .mp-page .bg-yellow-100 { background:rgba(234,179,8,.14); }
  html.dark .mp-page .bg-orange-100 { background:rgba(249,115,22,.14); }
  html.dark .mp-page .bg-green-50  { background:rgba(34,197,94,.08); }
  html.dark .mp-page .bg-green-100 { background:rgba(34,197,94,.14); }
  html.dark .mp-page .bg-emerald-50, html.dark .mp-page .bg-emerald-100 { background:rgba(16,185,129,.14); }
  html.dark .mp-page .bg-sky-100  { background:rgba(14,165,233,.14); }
  html.dark .mp-page .bg-teal-100 { background:rgba(20,184,166,.14); }
  html.dark .mp-page .hover\:bg-gray-50:hover { background:#243044; }
  html.dark .mp-page .hover\:bg-gray-200:hover { background:#334155; }
  html.dark .mp-page .hover\:bg-green-200:hover { background:rgba(34,197,94,.25); }
  html.dark .mp-page .hover\:bg-red-100:hover { background:rgba(239,68,68,.2); }
  html.dark .mp-page .hover\:bg-amber-100:hover { background:rgba(245,158,11,.2); }
  html.dark .mp-page .text-blue-700, html.dark .mp-page .text-blue-600 { color:#93c5fd; }
  html.dark .mp-page .text-cyan-700 { color:#67e8f9; }
  html.dark .mp-page .text-indigo-700, html.dark .mp-page .text-indigo-600 { color:#a5b4fc; }
  html.dark .mp-page .text-violet-700 { color:#c4b5fd; }
  html.dark .mp-page .text-purple-700, html.dark .mp-page .text-purple-600 { color:#c4b5fd; }
  html.dark .mp-page .text-red-700, html.dark .mp-page .text-red-600, html.dark .mp-page .text-red-500 { color:#fca5a5; }
  html.dark .mp-page .text-amber-700, html.dark .mp-page .text-amber-600 { color:#fcd34d; }
  html.dark .mp-page .text-yellow-700 { color:#fde047; }
  html.dark .mp-page .text-orange-700, html.dark .mp-page .text-orange-600 { color:#fdba74; }
  html.dark .mp-page .text-green-700, html.dark .mp-page .text-green-600 { color:#86efac; }
  html.dark .mp-page .text-emerald-700, html.dark .mp-page .text-emerald-600 { color:#34d399; }
  html.dark .mp-page .text-sky-700 { color:#7dd3fc; }
  html.dark .mp-page .text-teal-700, html.dark .mp-page .text-teal-600 { color:#5eead4; }
  html.dark .mp-page .text-slate-600, html.dark .mp-page .text-slate-500 { color:#94a3b8; }
</style>
