<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prepare Yourself - {% block title %}Smart Learning{% endblock %}</title>

    <!-- Dark mode: apply before paint to prevent flash -->
    <script>(function(){var t=localStorage.getItem('py-theme');if(t==='dark'||(t===null&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');})()</script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={darkMode:'class'}</script>

    <!-- AOS — Animate on Scroll -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">

    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <!-- KaTeX (math rendering) -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
          integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+"
          crossorigin="anonymous">
    <script defer
            src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
            integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg"
            crossorigin="anonymous"></script>
    <script defer
            src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
            integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMofbd/ugpvmd2Vved"
            crossorigin="anonymous"></script>

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 font-sans antialiased">

    <!-- Scroll progress bar -->
    <div id="scroll-progress"></div>

    {% include 'includes/navbar.html' %}

    <main class="min-h-screen">
        {% block content %}{% endblock %}
    </main>

    {% include 'includes/footer.html' %}

    <!-- Back to top button -->
    <button id="back-to-top" aria-label="Back to top" title="Back to top">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <!-- AOS JS -->
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

    <script>
    /* ─── KaTeX ─────────────────────────────────────── */
    (function () {
        var KATEX_OPTS = {
            delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '\\[', right: '\\]', display: true },
                { left: '$',  right: '$',  display: false },
                { left: '\\(', right: '\\)', display: false }
            ],
            throwOnError: false,
            ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
            ignoredClasses: ['no-math']
        };
        window.renderMath = function (el) {
            if (window.renderMathInElement) window.renderMathInElement(el || document.body, KATEX_OPTS);
        };
        window.addEventListener('load', function () { window.renderMath(); });
    })();

    /* ─── AOS init ──────────────────────────────────── */
    AOS.init({
        duration: 650,
        easing: 'ease-out-expo',
        once: true,
        offset: 70,
        delay: 0,
    });

    /* ─── Scroll progress bar ───────────────────────── */
    (function () {
        var bar = document.getElementById('scroll-progress');
        function update() {
            var scrolled = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight) * 100;
            bar.style.width = Math.min(scrolled, 100) + '%';
        }
        window.addEventListener('scroll', update, { passive: true });
    })();

    /* ─── Back-to-top button ────────────────────────── */
    (function () {
        var btn = document.getElementById('back-to-top');
        window.addEventListener('scroll', function () {
            btn.classList.toggle('visible', window.scrollY > 400);
        }, { passive: true });
        btn.addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    })();

    /* ─── Navbar glassmorphism on scroll ────────────── */
    (function () {
        var nav = document.getElementById('main-navbar');
        if (!nav) return;
        function update() { nav.classList.toggle('scrolled', window.scrollY > 60); }
        window.addEventListener('scroll', update, { passive: true });
        update();
    })();

    /* ─── Mobile hamburger menu ─────────────────────── */
    (function () {
        var ham = document.getElementById('hamburger');
        var menu = document.getElementById('mobile-menu');
        if (!ham || !menu) return;
        ham.addEventListener('click', function () {
            ham.classList.toggle('open');
            menu.classList.toggle('open');
        });
        document.addEventListener('click', function (e) {
            if (!ham.contains(e.target) && !menu.contains(e.target)) {
                ham.classList.remove('open');
                menu.classList.remove('open');
            }
        });
    })();

    /* ─── 3D Tilt effect ────────────────────────────── */
    (function () {
        function initTilt() {
            document.querySelectorAll('[data-tilt]').forEach(function (el) {
                var max = parseFloat(el.dataset.tiltMax || '10');
                el.addEventListener('mousemove', function (e) {
                    var r = el.getBoundingClientRect();
                    var x = ((e.clientX - r.left) / r.width  - 0.5) * 2;
                    var y = ((e.clientY - r.top)  / r.height - 0.5) * 2;
                    var rx = -y * max, ry = x * max;
                    var shadowX = ry * 0.5, shadowY = -rx * 0.5;
                    el.style.transition = 'transform 0.05s ease';
                    el.style.transform  = 'perspective(800px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg) scale3d(1.04,1.04,1.04)';
                    el.style.boxShadow  = shadowX + 'px ' + (shadowY + 12) + 'px 32px rgba(59,130,246,0.22)';
                });
                el.addEventListener('mouseleave', function () {
                    el.style.transition = 'transform 0.55s cubic-bezier(0.16,1,0.3,1), box-shadow 0.4s ease';
                    el.style.transform  = 'perspective(800px) rotateX(0deg) rotateY(0deg) scale3d(1,1,1)';
                    el.style.boxShadow  = '';
                });
            });
        }
        document.addEventListener('DOMContentLoaded', initTilt);
    })();

    /* ─── Ripple effect on .ripple elements ─────────── */
    (function () {
        document.addEventListener('click', function (e) {
            var btn = e.target.closest('.ripple');
            if (!btn) return;
            var r = btn.getBoundingClientRect();
            var wave = document.createElement('span');
            wave.className = 'ripple-wave';
            var size = Math.max(r.width, r.height) * 2;
            wave.style.cssText = [
                'width:' + size + 'px',
                'height:' + size + 'px',
                'left:' + (e.clientX - r.left - size / 2) + 'px',
                'top:' + (e.clientY - r.top - size / 2) + 'px',
            ].join(';');
            btn.appendChild(wave);
            setTimeout(function () { wave.remove(); }, 700);
        });
    })();

    /* ─── Dark / Light mode toggle ──────────────────── */
    (function () {
        function setTheme(dark) {
            if (dark) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('py-theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('py-theme', 'light');
            }
        }
        function bindToggle(btnId) {
            var btn = document.getElementById(btnId);
            if (btn) btn.addEventListener('click', function () {
                setTheme(!document.documentElement.classList.contains('dark'));
            });
        }
        bindToggle('theme-toggle');
        bindToggle('theme-toggle-mobile');
    })();

    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
